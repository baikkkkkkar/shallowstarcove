<!DOCTYPE html>

<head>

    <title>漂流瓶 · 浅岸星滩的回响</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            user-select: none;
        }
        body {
            min-height: 100vh;
            font-family: 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            color: #2c4a3b;
            position: relative;

        .sky-sand {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(165deg, #b3e0f5 0%, #d9f0fa 40%, #fef7e0 70%, #f5e6c4 100%);
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background-color: #fff9e0;
            border-radius: 50%;
            box-shadow: 0 0 4px 1px rgba(255,255,200,0.8);
            opacity: 0;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .wave-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            filter: drop-shadow(0 -8px 18px rgba(66, 166, 208, .16));
        }
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-repeat: repeat-x;
            background-size: 2400px 150px;
            background-position-y: bottom;
            mix-blend-mode: soft-light;
            will-change: background-position;
        }
        .wave1 {

            animation: waveMove 22s linear infinite;
        }
        .wave2 {

<body>
<div class="sky-sand"></div>
<div class="stars" id="starsContainer"></div>
<div class="wave-container" aria-hidden="true">
    <div class="wave wave1"></div>
    <div class="wave wave2"></div>
    <div class="wave wave3"></div>
</div>
<audio id="homeWhiteNoise" preload="auto" loop>
    <source src="audio/white-noise.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="header">
        <span class="title">💌 漂流瓶 · 潮汐回响</span>
        <a href="zhuye.html" class="back-home">🌊 返回浅岸星滩</a>
    </div>
    <div class="bottle-card">
        <div class="subtitle">✨ 把你想说的话，装进瓶子，漂向大海 ✨</div>
        <div class="messages" id="messagesList">
            <div style="text-align:center; padding:2rem;">加载留言中...</div>
        </div>

        <!-- 建议与联系 -->
        <div class="info-card">
            <p>💌 如果你对这个IP有任何建议或想法，我们将会十分感谢！</p>
            <p>📧 请联系我：<a href="mailto:1660911249@qq.com">1660911249@qq.com</a></p>
        </div>

        <!-- QQ社群二维码（可长按保存） -->
        <div class="info-card">
            <p>🐧 欢迎加入「浅岸星滩」QQ社群</p>
            <p>一起分享高敏感日常、角色同人、文创福利～</p>
            <!-- 移除 draggable / oncontextmenu 等禁止保存的属性，允许用户长按保存 -->
            <img src="images/qq_group_qr_watermarked.png" alt="QQ群二维码" class="qr-img">
            <p>长按识别二维码 | 群号：2161025447</p>
        </div>

        <div class="input-area">
            <textarea id="messageInput" rows="2" placeholder="匿名留言… 可以是你对作品的感受、一句鼓励、或者随便想说的话 (最多200字)" maxlength="200"></textarea>
            <button class="send-btn" id="sendBtn">🌊 投入漂流瓶 🌊</button>
        </div>
    </div>
    <footer>🌸 每一次留言都是一次潮汐相遇，所有敏感都值得被听见</footer>
</div>

<script>
    // 生成星星
    function generateStars() {
        const starsContainer = document.getElementById('starsContainer');
        if (!starsContainer) return;
        const starCount = 100;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 60 + '%';
            star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            starsContainer.appendChild(star);
        }
    }
    generateStars();

    // ==================== 本地存储留言板（演示版，仅对自己可见）====================
    let messages = [];

    function loadLocalMessages() {
        const stored = localStorage.getItem('driftMessages');
        if (stored) {
            messages = JSON.parse(stored);
        } else {
            messages = [
                { content: '🌊 第一个漂流瓶！希望浅岸星滩越来越美～', time: new Date(Date.now() - 86400000).toISOString(), avatar: '🐚' },
                { content: '敏感不是缺点，是温柔的天赋✨', time: new Date(Date.now() - 3600000).toISOString(), avatar: '⭐' }
            ];
            saveLocalMessages();
        }
        renderMessages();
    }

    function saveLocalMessages() {
        localStorage.setItem('driftMessages', JSON.stringify(messages));
    }

    function addLocalMessage(content) {
        const newMsg = {
            content: content,
            time: new Date().toISOString(),
            avatar: ['🐚', '🐟', '🌊', '⭐', '🌸', '🪸', '🐙', '🦀', '🐢', '🍃'][Math.floor(Math.random() * 10)]
        };
        messages.unshift(newMsg);
        if (messages.length > 100) messages.pop();
        saveLocalMessages();
        renderMessages();
    }

    function timeAgo(date) {
        const seconds = Math.floor((new Date() - new Date(date)) / 1000);
        let interval = Math.floor(seconds / 31536000);
        if (interval > 1) return interval + '年前';
        interval = Math.floor(seconds / 2592000);
        if (interval > 1) return interval + '个月前';
        interval = Math.floor(seconds / 86400);
        if (interval > 1) return interval + '天前';
        interval = Math.floor(seconds / 3600);
        if (interval > 1) return interval + '小时前';
        interval = Math.floor(seconds / 60);
        if (interval > 1) return interval + '分钟前';
        return '刚刚';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!messages.length) {
            container.innerHTML = '<div style="text-align:center; padding:2rem;">💧 还没有漂流瓶，来投下第一封信吧～</div>';
            return;
        }
        let html = '';
        messages.forEach(msg => {
            html += `
                <div class="message-item">
                    <div class="message-header">
                        <span class="avatar">${msg.avatar}</span>
                        <span class="time">${timeAgo(msg.time)}</span>
                    </div>
                    <div class="message-content">${escapeHtml(msg.content)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    document.getElementById('sendBtn').addEventListener('click', () => {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!content) {
            alert('写点什么再投入大海吧～');
            return;
        }
        addLocalMessage(content);
        input.value = '';
        document.querySelector('.messages').scrollTop = 0;
    });

    loadLocalMessages();
</script>

<script>
    // 首页白噪音：自动尝试播放；若浏览器拦截，会在第一次点击/滚动/按键时启动
    (function initHomeWhiteNoise() {
        const whiteNoise = document.getElementById('homeWhiteNoise');
        if (!whiteNoise) return;

        whiteNoise.volume = 0.24;
        whiteNoise.loop = true;

        function playWhiteNoise() {
            if (!whiteNoise || !whiteNoise.paused) return;
            whiteNoise.play().catch(() => {
                // 浏览器可能拦截自动播放，等待用户第一次交互后再启动
            });
        }

        window.addEventListener('load', playWhiteNoise);
        ['pointerdown', 'click', 'wheel', 'keydown', 'touchstart'].forEach(eventName => {
            document.addEventListener(eventName, playWhiteNoise, { once: true, passive: true });
        });
    })();
</script>
</body>
</html>
