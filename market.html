<script>
    function generateStars() {
        const starsContainer = document.getElementById('starsContainer');
        if (!starsContainer) return;
        const starCount = 100;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 60 + '%';
            star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            starsContainer.appendChild(star);
        }
    }
    generateStars();

    // ========== 毕设展板照片列表（共11张） ==========
    const photos = [
        "images/1_watermarked.jpg", "images/2_watermarked.jpg", "images/3_watermarked.jpg", "images/4_watermarked.jpg", "images/5_watermarked.jpg",
        "images/6_watermarked.jpg", "images/7_watermarked.jpg", "images/8_watermarked.jpg", "images/9_watermarked.jpg", "images/10_watermarked.jpg",
        "images/11_watermarked.jpg"
    ];
    // 将展板3(索引2)、10(索引9)、11(索引10)合并为一个卡片
    const items = [];
    items.push({
        type: 'triple',
        src1: photos[2],
        src2: photos[9],
        src3: photos[10],
        index1: 3,
        index2: 10,
        index3: 11
    });
    for (let i = 0; i < photos.length; i++) {
        if (i !== 2 && i !== 9 && i !== 10) {
            items.push({
                type: 'single',
                src: photos[i],

<script>
    // 首页白噪音：自动尝试播放；若浏览器拦截，会在第一次点击/滚动/按键时启动
    (function initHomeWhiteNoise() {
        const whiteNoise = document.getElementById('homeWhiteNoise');
        if (!whiteNoise) return;

        whiteNoise.volume = 0.24;
        whiteNoise.loop = true;

        function playWhiteNoise() {
            if (!whiteNoise || !whiteNoise.paused) return;
            whiteNoise.play().catch(() => {
                // 浏览器可能拦截自动播放，等待用户第一次交互后再启动
            });
        }

        window.addEventListener('load', playWhiteNoise);
        ['pointerdown', 'click', 'wheel', 'keydown', 'touchstart'].forEach(eventName => {
            document.addEventListener(eventName, playWhiteNoise, { once: true, passive: true });
        });
    })();
</script>
