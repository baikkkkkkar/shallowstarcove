<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>观海｜浅岸星滩</title>
<style>
  :root{
    --mx:0px; --my:0px;
    --pink:#f8c9d8;
    --blue:#9fc8e8;
    --deep:#536f93;
    --sand:#f4dcc6;
    --ink:#43536b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#fff;background:#111827;}
  body{cursor:default;}
  .page{position:relative;width:100vw;height:100vh;overflow:hidden;background:#8fb7d0;isolation:isolate;}

  /* 二次元清透感观海背景贴图：作为主视觉，不影响原本鼠标跟随逻辑 */
  .bg-art{
    position:absolute;
    inset:-7vh -7vw;
    z-index:-5;
    background:url("bg-sea_watermarked.jpg") center/cover no-repeat;
    transform:translate(calc(var(--mx)*-0.018),calc(var(--my)*-0.012)) scale(1.045);
    transition:transform .25s ease-out, filter .8s ease, opacity .8s ease;
    filter:saturate(1.08) brightness(1.03);
  }
  .bg-art::after{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 70% 23%,rgba(255,246,220,.35),transparent 28%),
      linear-gradient(180deg,rgba(98,125,169,.12),rgba(255,226,218,.06) 42%,rgba(63,92,136,.22));
    mix-blend-mode:soft-light;
    pointer-events:none;
  }
  .page.zoom-duck .bg-art{transform:translate(calc(var(--mx)*-0.01),calc(var(--my)*-0.006)) scale(1.16);filter:saturate(1.12) brightness(.98) blur(.4px);}

  /* 原交互层保留：天空/水面变成轻薄动态叠层，让背景不再显丑 */
  .sky{position:absolute;inset:-6vh -6vw 34vh -6vw;transform:translate(calc(var(--mx)*-0.015),calc(var(--my)*-0.01));transition:transform .25s ease-out;opacity:.42;mix-blend-mode:screen;pointer-events:none;}
  .sun{position:absolute;right:15vw;top:13vh;width:12vw;height:12vw;border-radius:50%;background:radial-gradient(circle,#fff3cf 0%,#f6c9a6 42%,rgba(246,201,166,.0) 72%);filter:blur(.5px);opacity:.72;}
  .cloud{position:absolute;border-radius:999px;background:rgba(255,255,255,.28);filter:blur(14px);}
  .cloud.c1{width:34vw;height:9vh;left:7vw;top:12vh}.cloud.c2{width:26vw;height:7vh;right:20vw;top:25vh}.cloud.c3{width:38vw;height:8vh;left:28vw;top:5vh;opacity:.24}

  .sea-wrap{position:absolute;inset:40vh -10vw -12vh -10vw;transform:translate(calc(var(--mx)*-0.035),calc(var(--my)*-0.028));transition:transform .18s ease-out,opacity .8s ease;opacity:.35;mix-blend-mode:soft-light;pointer-events:none;}
  .page.zoom-duck .sea-wrap{opacity:.55;}
  .sea{position:absolute;inset:0;background:linear-gradient(180deg,rgba(191,224,238,.55) 0%,rgba(111,158,193,.42) 48%,rgba(61,96,145,.34) 100%);overflow:hidden;}
  .sea::before{content:"";position:absolute;inset:-10%;background:
    radial-gradient(ellipse at 20% 28%,rgba(255,255,255,.38) 0 2%,transparent 12%),
    radial-gradient(ellipse at 68% 18%,rgba(255,238,218,.35) 0 3%,transparent 14%),
    repeating-linear-gradient(175deg,rgba(255,255,255,.24) 0 2px,transparent 2px 38px),
    repeating-linear-gradient(8deg,rgba(255,255,255,.12) 0 1px,transparent 1px 32px);
    animation:waterDrift 13s linear infinite;mix-blend-mode:screen;opacity:.72;}
  .sea::after{content:"";position:absolute;inset:-10%;background:repeating-radial-gradient(ellipse at 55% 35%,rgba(70,95,135,.16) 0 2px,transparent 3px 26px);transform:rotate(-3deg);animation:waterDrift2 18s linear infinite;opacity:.38;}
  @keyframes waterDrift{to{transform:translateX(-7vw) translateY(2vh)}}
  @keyframes waterDrift2{to{transform:rotate(-3deg) translateX(6vw)}}

  .shore{position:absolute;left:-8vw;right:-8vw;bottom:-14vh;height:28vh;background:radial-gradient(ellipse at 42% 0%,rgba(255,255,255,.45) 0 6%,transparent 22%),linear-gradient(180deg,rgba(255,244,231,.28) 0%,rgba(232,195,161,.18) 38%,rgba(202,161,127,.12) 100%);clip-path:ellipse(68% 49% at 50% 77%);filter:drop-shadow(0 -20px 35px rgba(255,255,255,.1));pointer-events:none;}
  .foam{position:absolute;left:-5vw;right:-5vw;bottom:12vh;height:10vh;background:repeating-linear-gradient(178deg,rgba(255,255,255,.34) 0 2px,transparent 2px 30px);opacity:.34;filter:blur(2px);animation:foam 7s ease-in-out infinite alternate;pointer-events:none;mix-blend-mode:screen;}
  @keyframes foam{from{transform:translateX(-1vw)}to{transform:translateX(2vw)}}

  /* entry */
  .entry{position:absolute;inset:0;display:grid;place-items:center;z-index:20;background:linear-gradient(180deg,rgba(31,48,74,.06),rgba(255,230,214,.08));transition:opacity .8s ease,visibility .8s ease;}
  .entry.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .entry-card{width:min(620px,86vw);padding:42px 46px;border:1px solid rgba(255,255,255,.72);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,248,252,.62));backdrop-filter:blur(18px);box-shadow:0 22px 80px rgba(68,89,122,.22),inset 0 1px 0 rgba(255,255,255,.7);text-align:center;}
  .eyebrow{font-size:13px;letter-spacing:.32em;opacity:.96;margin-bottom:16px;text-transform:uppercase;color:#7586a1;text-shadow:none;}
  h1{font-size:clamp(44px,7vw,78px);font-weight:500;letter-spacing:.2em;color:#48637f;text-shadow:0 5px 18px rgba(255,255,255,.48);}
  .entry-card p{margin:20px auto 30px;max-width:470px;line-height:1.9;color:#607690;font-size:15px;text-shadow:none;}
  .watch-btn{border:0;border-radius:999px;padding:15px 42px;font-size:18px;letter-spacing:.18em;color:#5c6d88;background:linear-gradient(135deg,#fff,#f7dbe4 48%,#dceefa);box-shadow:0 14px 30px rgba(83,111,147,.22),inset 0 0 0 1px rgba(255,255,255,.8);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;}
  .watch-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 20px 42px rgba(83,111,147,.32),0 0 28px rgba(255,230,240,.65)}

  /* hud */
  .hud{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 1s ease;}
  .page.active .hud{opacity:1;}
  .tip{position:absolute;left:5vw;top:6vh;padding:18px 22px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.38));border:1px solid rgba(255,255,255,.56);backdrop-filter:blur(14px);box-shadow:0 12px 42px rgba(61,83,117,.16);color:#516780;text-shadow:none;}
  .tip strong{display:block;font-size:22px;font-weight:600;letter-spacing:.08em;margin-bottom:6px;color:#48637f}.tip span{font-size:13px;opacity:.92;letter-spacing:.04em;color:#6a819d}
  .cursor-follow{position:absolute;width:190px;height:190px;border:1px solid rgba(255,255,255,.35);border-radius:50%;left:calc(50% + var(--mx) - 95px);top:calc(50% + var(--my) - 95px);box-shadow:0 0 60px rgba(255,255,255,.13),inset 0 0 40px rgba(255,255,255,.08);transition:left .12s ease-out,top .12s ease-out,transform .8s ease;}
  .page.zoom-duck .cursor-follow{transform:scale(1.35);}
  .cursor-follow::before,.cursor-follow::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px dashed rgba(255,255,255,.28)}
  .cursor-follow::before{width:120px;height:120px}.cursor-follow::after{width:12px;height:12px;background:rgba(255,255,255,.55);border:0}
  .found-note{position:absolute;right:6vw;bottom:8vh;padding:14px 18px;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.44),rgba(255,255,255,.28));border:1px solid rgba(255,255,255,.45);font-size:13px;letter-spacing:.05em;color:#526983;backdrop-filter:blur(10px);transition:opacity .4s ease;box-shadow:0 10px 24px rgba(86,109,139,.1);}
  .page.zoom-duck .found-note{opacity:.42;}

  /* 图片贴图版鸭鸭：保留 floaty、hover、点击切近景，不再用丑 CSS 拼图 */
  .duck-zone{
    position:absolute;
    left:58.5%;
    top:47%;
    width:210px;
    height:150px;
    z-index:5;
    transform:translate(calc(var(--mx)*-0.06),calc(var(--my)*-0.05));
    transition:left .9s cubic-bezier(.22,.9,.22,1),top .9s cubic-bezier(.22,.9,.22,1),width .9s cubic-bezier(.22,.9,.22,1),height .9s cubic-bezier(.22,.9,.22,1),transform .2s ease-out,filter .8s ease;
    animation:floaty 4.8s ease-in-out infinite;
    cursor:pointer;
  }
  @keyframes floaty{0%,100%{margin-top:0;rotate:-1.6deg}50%{margin-top:-10px;rotate:1.8deg}}
  .page.zoom-duck .duck-zone{
    left:50%;
    top:52%;
    width:min(620px,74vw);
    height:min(420px,52vh);
    transform:translate(-50%,-50%) !important;
    z-index:13;
    filter:drop-shadow(0 30px 46px rgba(39,69,103,.25));
  }
  .duck-asset{
    position:absolute;
    left:50%;
    top:50%;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:translate(-50%,-50%) scale(1);
    filter:drop-shadow(0 14px 16px rgba(47,76,105,.24));
    transition:opacity .28s ease, transform .46s cubic-bezier(.2,.8,.2,1), filter .4s ease;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .duck-zone.action-kick .duck-asset{transform:translate(-50%,-50%) rotate(3deg) scale(1.07);}
  .duck-zone.action-flap .duck-asset{transform:translate(-50%,-52%) rotate(-4deg) scale(1.08);}
  .duck-zone.action-roll .duck-asset{transform:translate(-50%,-49%) rotate(6deg) scale(1.06);}
  .page.zoom-duck .duck-zone.action-kick .duck-asset,
  .page.zoom-duck .duck-zone.action-flap .duck-asset,
  .page.zoom-duck .duck-zone.action-roll .duck-asset{transform:translate(-50%,-50%) scale(1.04);}

  .ripple{position:absolute;left:9%;right:3%;bottom:27%;height:24px;border-radius:50%;border-top:2px solid rgba(255,255,255,.42);border-bottom:1px solid rgba(82,112,143,.12);filter:blur(.2px);animation:ripple 2.8s ease-in-out infinite;pointer-events:none;}
  .ripple.r2{bottom:20%;left:0;right:17%;animation-delay:.7s;opacity:.55}.ripple.r3{bottom:36%;left:22%;right:-3%;animation-delay:1.2s;opacity:.4}
  @keyframes ripple{50%{transform:scaleX(1.12);opacity:.22}}
  .page.zoom-duck .ripple{border-top-color:rgba(255,255,255,.62);height:34px;}
  .splash{
    position:absolute;
    left:50%;top:56%;
    width:18px;height:18px;border-radius:50%;
    opacity:0;
    background:radial-gradient(circle,rgba(255,255,255,.92) 0 2px,transparent 3px),radial-gradient(circle at 80% 30%,rgba(203,236,255,.76) 0 2px,transparent 3px);
    filter:drop-shadow(0 0 10px rgba(255,255,255,.55));
    pointer-events:none;
  }
  .duck-zone.splashing .splash{animation:splashPop .75s ease-out forwards;}
  .splash.s2{left:33%;top:61%;animation-delay:.08s}.splash.s3{left:66%;top:42%;animation-delay:.13s}.splash.s4{left:72%;top:60%;animation-delay:.18s}
  @keyframes splashPop{0%{opacity:0;transform:translate(0,0) scale(.45)}35%{opacity:.95}100%{opacity:0;transform:translate(var(--sx,12px),-44px) scale(1.3)}}

  .bubble{position:absolute;right:13%;top:22%;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.72);opacity:0;animation:bubble 5.5s infinite;pointer-events:none;}
  .bubble.b2{right:22%;top:14%;width:5px;height:5px;animation-delay:.4s}.bubble.b3{right:8%;top:35%;width:4px;height:4px;animation-delay:.9s}
  @keyframes bubble{0%,82%{opacity:0;transform:translateY(8px) scale(.7)}90%{opacity:.8}100%{opacity:0;transform:translateY(-22px) scale(1)}}
  .duck-label{position:absolute;left:50%;top:-18px;transform:translateX(-50%);white-space:nowrap;font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.86);text-shadow:0 2px 8px rgba(41,58,86,.35);opacity:0;transition:opacity .3s ease,top .8s ease;pointer-events:none;}
  .duck-zone:hover .duck-label,.page.zoom-duck .duck-label{opacity:1;}
  .page.zoom-duck .duck-label{top:-28px;font-size:13px;}

  .stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.72) 0 1px,transparent 1.5px),radial-gradient(circle,rgba(255,220,236,.55) 0 1px,transparent 1.5px);background-size:120px 120px,170px 170px;background-position:10px 40px,80px 20px;opacity:.18;}

  .mini-actions{position:absolute;left:5vw;bottom:5vh;display:flex;gap:12px;z-index:12;opacity:0;transition:opacity 1s ease;flex-wrap:wrap;}.page.active .mini-actions{opacity:1}.chip{pointer-events:auto;border:1px solid rgba(255,255,255,.56);background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.3));backdrop-filter:blur(10px);color:#4e6885;border-radius:999px;padding:10px 15px;font-size:13px;letter-spacing:.08em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(82,112,143,.12);transition:transform .25s ease,background .25s ease,box-shadow .25s ease}.chip:hover{background:rgba(255,255,255,.58);transform:translateY(-2px);box-shadow:0 12px 28px rgba(82,112,143,.18)}.home-chip{padding-inline:17px;}

  @media (max-width: 700px){
    .tip{left:5vw;right:5vw;top:4vh}.tip strong{font-size:18px}.found-note{display:none}.duck-zone{width:170px;height:120px;left:54%;top:50%;}.page.zoom-duck .duck-zone{width:88vw;height:50vh}.entry-card{padding:34px 28px}.mini-actions{bottom:4vh;left:50%;transform:translateX(-50%);}
  }
</style>
</head>
<body>
  <main class="page" id="page">
    <div class="bg-art" aria-hidden="true"></div>
    <div class="stars"></div>
    <section class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></section>
    <section class="sea-wrap"><div class="sea"></div></section>
    <div class="foam"></div><div class="shore"></div>

    <div class="duck-zone" id="duckZone" aria-label="仰泳的普通秋沙鸭" role="button" tabindex="0">
      <div class="duck-label">普通秋沙鸭 · 仰泳中</div>
      <div class="ripple"></div><div class="ripple r2"></div><div class="ripple r3"></div>
      <div class="bubble"></div><div class="bubble b2"></div><div class="bubble b3"></div>
      <span class="splash s1" style="--sx:-18px"></span><span class="splash s2" style="--sx:14px"></span><span class="splash s3" style="--sx:24px"></span><span class="splash s4" style="--sx:-10px"></span>
      <img class="duck-asset" id="duckImg" src="duck-idle_watermarked.png" alt="一只二次元清透感画风、正在仰泳的普通秋沙鸭" />
    </div>

    <section class="entry" id="entry">
      <div class="entry-card">
        <div class="eyebrow">SHALLOWSTAR COVE · SEA WATCHING</div>
        <h1>观海</h1>
        <p>风很轻，浪也慢。点一下入口，跟着鼠标把镜头移向海面，找一只正在认真仰泳的秋沙鸭。</p>
        <button class="watch-btn" id="watchBtn">观海</button>
      </div>
    </section>

    <section class="hud">
      <div class="tip"><strong>寻找那只仰泳的秋沙鸭</strong><span>移动鼠标，镜头会轻轻跟随海面。</span></div>
      <div class="cursor-follow"></div>
      <div class="found-note">提示：它一直在仰泳，只是偶尔会扑腾脚丫。</div>
    </section>
    <div class="mini-actions"><a class="chip" href="../xingtan_amo_lighthouse_ui_linked_update/xingtan_manbu.html">回到星滩漫步</a><button class="chip" id="resetBtn">退出近景</button><button class="chip" id="focusBtn">看看鸭鸭</button><a class="chip home-chip" id="homeBtn" href="../zhuye.html">返回浅岸星滩主页</a></div>

    <audio id="oceanAudio" loop preload="auto" hidden>
      <source src="sea-waves.mp3" type="audio/mpeg">
    </audio>
    <audio id="clickAudio" preload="auto" hidden>
      <source src="ui-click.wav" type="audio/wav">
    </audio>
    <audio id="duckAudio" preload="auto" hidden>
      <source src="duck-quack.wav" type="audio/wav">
    </audio>
  </main>
<script>
  const page = document.getElementById('page');
  const entry = document.getElementById('entry');
  const watchBtn = document.getElementById('watchBtn');
  const resetBtn = document.getElementById('resetBtn');
  const focusBtn = document.getElementById('focusBtn');
  const homeBtn = document.getElementById('homeBtn');
  const duckZone = document.getElementById('duckZone');
  const duckImg = document.getElementById('duckImg');
  const oceanAudio = document.getElementById('oceanAudio');
  const clickAudio = document.getElementById('clickAudio');
  const duckAudio = document.getElementById('duckAudio');

  let focusDuck = false;
  let closeMode = false;
  let actionTimer = null;
  let audioCtx = null;

  const duckFrames = [
    {src:'duck-idle_watermarked.png', cls:''},
    {src:'duck-kick_watermarked.png', cls:'action-kick'},
    {src:'duck-flap_watermarked.png', cls:'action-flap'},
    {src:'duck-roll_watermarked.png', cls:'action-roll'}
  ];

  // 预加载贴图，切换动作时不闪。
  [...duckFrames.map(f=>f.src), 'duck-close_watermarked.png'].forEach(src=>{ const img = new Image(); img.src = src; });

  function ensureAudioContext(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tryPlayAudio(el, volume=1){
    if(!el) return false;
    try{
      el.pause();
      el.currentTime = 0;
      el.volume = volume;
      const p = el.play();
      if(p && typeof p.then === 'function') p.catch(()=>{});
      return true;
    }catch(err){
      return false;
    }
  }

  function playTone({type='sine', start=880, end=660, duration=.12, volume=.03, delay=0, filter=null}){
    const ctx = ensureAudioContext();
    if(!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    if(filter){
      const biq = ctx.createBiquadFilter();
      biq.type = filter.type || 'lowpass';
      biq.frequency.setValueAtTime(filter.freq || 1200, now);
      if(filter.endFreq) biq.frequency.exponentialRampToValueAtTime(Math.max(40, filter.endFreq), now + duration);
      osc.connect(biq);
      biq.connect(gain);
    }else{
      osc.connect(gain);
    }
    gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(start, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(40, end), now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(volume, now + .012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.start(now);
    osc.stop(now + duration + .03);
  }

  function playNoiseSplash(){
    const ctx = ensureAudioContext();
    if(!ctx) return;
    const bufferSize = Math.floor(ctx.sampleRate * 0.08);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1 - i/bufferSize) * 0.28;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1500;
    const gain = ctx.createGain();
    gain.gain.value = 0.018;
    noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    noise.start();
  }

  function playUIClick(kind='soft'){
    // 优先播放文件夹里的 ui-click.wav/mp3；没有也有合成音效兜底。
    if(clickAudio && clickAudio.readyState >= 2 && tryPlayAudio(clickAudio, .85)) return;
    if(kind === 'primary'){
      playTone({type:'triangle', start:980, end:620, duration:.12, volume:.075});
      playTone({type:'sine', start:1480, end:1080, duration:.10, volume:.04, delay:.035});
    }else if(kind === 'focus'){
      playTone({type:'triangle', start:1180, end:780, duration:.12, volume:.075});
      playTone({type:'sine', start:1580, end:1100, duration:.11, volume:.045, delay:.035});
      playNoiseSplash();
    }else{
      playTone({type:'sine', start:1040, end:720, duration:.10, volume:.06});
      playTone({type:'triangle', start:1320, end:980, duration:.08, volume:.035, delay:.03});
    }
  }

  function playDuckQuack(){
    // 优先播放文件夹里的 duck-quack.wav/mp3；没有也有合成鸭叫兜底。
    if(duckAudio && duckAudio.readyState >= 2 && tryPlayAudio(duckAudio, .95)) return;
    playTone({type:'square', start:560, end:390, duration:.16, volume:.08, filter:{type:'lowpass', freq:1350, endFreq:720}});
    playTone({type:'square', start:450, end:310, duration:.17, volume:.07, delay:.13, filter:{type:'lowpass', freq:1100, endFreq:620}});
  }

  function playOcean(){
    if(!oceanAudio) return;
    try{
      oceanAudio.volume = 0.62;
      const p = oceanAudio.play();
      if(p && typeof p.then === 'function') p.catch(()=>{});
    }catch(err){}
  }


  function setMouse(x,y){
    const cx = window.innerWidth/2, cy = window.innerHeight/2;
    page.style.setProperty('--mx', (x-cx)+'px');
    page.style.setProperty('--my', (y-cy)+'px');
  }

  function setDuckFrame(frame){
    duckZone.classList.remove('action-kick','action-flap','action-roll','splashing');
    duckImg.style.opacity = '0';
    setTimeout(()=>{
      duckImg.src = frame.src;
      if(frame.cls) duckZone.classList.add(frame.cls, 'splashing');
      duckImg.style.opacity = '1';
    }, 120);
  }

  function randomDuckAction(){
    if(closeMode) return;
    const frame = duckFrames[Math.floor(Math.random() * duckFrames.length)];
    setDuckFrame(frame);
    if(frame.cls) playNoiseSplash();
    window.clearTimeout(actionTimer);
    actionTimer = window.setTimeout(()=>setDuckFrame(duckFrames[0]), 950);
  }

  function enterCloseView(){
    closeMode = true;
    focusDuck = true;
    page.classList.add('zoom-duck');
    duckZone.classList.remove('action-kick','action-flap','action-roll','splashing');
    duckImg.src = 'duck-close_watermarked.png';
    setMouse(window.innerWidth * .64, window.innerHeight * .48);
    playUIClick('focus');
    playDuckQuack();
  }

  function leaveCloseView(){
    closeMode = false;
    focusDuck = false;
    page.classList.remove('zoom-duck');
    setDuckFrame(duckFrames[0]);
    setMouse(window.innerWidth/2, window.innerHeight/2);
    playUIClick('soft');
  }

  window.addEventListener('mousemove', e=>{ if(!focusDuck) setMouse(e.clientX,e.clientY); });

  watchBtn.addEventListener('click',()=>{
    ensureAudioContext();
    playUIClick('primary');
    playOcean();
    entry.classList.add('hidden');
    page.classList.add('active');
  });

  resetBtn.addEventListener('click', leaveCloseView);
  focusBtn.addEventListener('click', enterCloseView);
  homeBtn.addEventListener('click',()=>{ ensureAudioContext(); playUIClick('soft'); });
  duckZone.addEventListener('click', enterCloseView);
  duckZone.addEventListener('keydown', e=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); enterCloseView(); }
  });

  // 鸭鸭偶尔自己换姿势，但一直保持仰泳。
  setInterval(randomDuckAction, 3600);
</script>
</body>
</html>
